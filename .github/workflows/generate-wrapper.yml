
name: Generate Gradle Wrapper

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-gradle-wrapper
  cancel-in-progress: false

jobs:
  generate-wrapper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          validate-wrappers: false

      - name: Generate real Gradle Wrapper
        run: |
          rm -f gradle/wrapper/gradle-wrapper.jar
          gradle wrapper --gradle-version 8.9 --distribution-type bin --no-validate-url
          chmod +x gradlew

      - name: Verify real Wrapper JAR
        run: |
          test -s gradle/wrapper/gradle-wrapper.jar
          SIZE=$(stat -c%s gradle/wrapper/gradle-wrapper.jar)
          echo "Wrapper JAR size: $SIZE bytes"
          test "$SIZE" -gt 10000
          sha256sum gradle/wrapper/gradle-wrapper.jar

      - name: Commit and push Wrapper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/
          git commit -m "Add valid Gradle Wrapper" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin HEAD:main
