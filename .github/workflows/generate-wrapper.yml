
name: Generate Gradle Wrapper

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-gradle-wrapper
  cancel-in-progress: false

jobs:
  generate-wrapper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          validate-wrappers: false

      - name: Synchronize main branch
        run: |
          git pull --rebase origin main

      - name: Generate Gradle Wrapper
        run: |
          rm -f gradle/wrapper/gradle-wrapper.jar
          gradle wrapper --gradle-version 8.9 --distribution-type bin --no-validate-url
          chmod +x gradlew
          ls -lh gradle/wrapper/gradle-wrapper.jar

      - name: Verify Wrapper
        run: |
          test -s gradlew
          test -s gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.properties
          test "$(stat -c%s gradle/wrapper/gradle-wrapper.jar)" -gt 10000
          sha256sum gradle/wrapper/gradle-wrapper.jar

      - name: Commit Wrapper
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Generate valid Gradle Wrapper"
          file_pattern: "gradlew gradlew.bat gradle/wrapper/*"
